<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WP3 Species Distribution Models (PNG)</title>
  <style>
    :root {
      --blue-dark:   #0068B4;
      --blue-mid:    #00A6D9;
      --blue-light:  #7DD9EE;
      --blue-pale:   #D6F0F8;
      --blue-paler:  #EBF7FC;
      --green-teal:  #00B388;
      --green-lime:  #8DC63F;
      --text-dark:   #1A3A4A;
      --text-mid:    #2C5F7A;
      --white:       #FFFFFF;
      --flag-green:  #2EA85A;
      --flag-yellow: #C97A08;
      --border:      #B8DDF0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: var(--text-dark);
      background: var(--blue-paler);
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: var(--blue-dark);
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 20px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.28);
      z-index: 10;
    }

    header img {
      height: 46px;
      width: auto;
    }

    header .header-title h1 {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.2;
    }

    header .header-title .subtitle {
      font-size: 12px;
      color: var(--blue-light);
      margin-top: 2px;
    }

    /* ── MAIN 3-COLUMN LAYOUT ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      width: 320px;
      flex-shrink: 0;
      background: var(--blue-pale);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .group-tabs {
      display: flex;
      background: var(--blue-dark);
      flex-shrink: 0;
    }

    .group-tab {
      flex: 1;
      padding: 9px 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--blue-light);
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .group-tab:hover { color: var(--white); }

    .group-tab.active {
      color: var(--white);
      border-bottom-color: var(--green-lime);
    }

    .search-wrap {
      padding: 8px 10px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }

    .search-input {
      width: 100%;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      background: var(--white);
      color: var(--text-dark);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--blue-mid);
      box-shadow: 0 0 0 2px rgba(0,166,217,0.2);
    }

    .species-count {
      font-size: 11px;
      color: var(--text-mid);
      padding: 5px 12px 3px;
      flex-shrink: 0;
    }

    .species-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 3px 0;
    }

    .species-list::-webkit-scrollbar { width: 5px; }
    .species-list::-webkit-scrollbar-track { background: transparent; }
    .species-list::-webkit-scrollbar-thumb { background: var(--blue-light); border-radius: 3px; }

    .species-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 10px 6px 10px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.12s;
    }

    .species-item:hover { background: rgba(0,166,217,0.1); }

    .species-item.active {
      background: rgba(0,179,136,0.13);
      border-left-color: var(--green-teal);
    }

    .flag-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .flag-dot.green  { background: var(--flag-green); }
    .flag-dot.yellow { background: var(--flag-yellow); }

    .species-name {
      font-style: italic;
      font-size: 12.5px;
      line-height: 1.4;
      color: var(--text-dark);
    }

    /* ── CENTRE PANEL ── */
    .centre-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .map-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      padding: 7px 10px 0;
      background: var(--white);
      border-bottom: 2px solid var(--blue-mid);
      flex-shrink: 0;
    }

    .map-tab {
      padding: 6px 13px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-mid);
      background: var(--blue-pale);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      margin-bottom: -2px;
      transition: background 0.12s, color 0.12s;
    }

    .map-tab:hover {
      background: rgba(0,166,217,0.18);
      color: var(--blue-dark);
    }

    .map-tab.active {
      background: var(--blue-mid);
      color: var(--white);
      border-color: var(--blue-mid);
    }

    .pdf-container {
      flex: 1;
      overflow: hidden;
      background: #EBF7FC;
      position: relative;
    }

    #img-viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
      position: relative;
      background: #ffffff;
    }

    #img-viewport.grabbing { cursor: grabbing; }

    #map-img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: 0 0;
      user-select: none;
      -webkit-user-drag: none;
      display: none;
    }

    #zoom-reset {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 10;
      padding: 5px 12px;
      background: rgba(255,255,255,0.85);
      color: #1A3A4A;
      border: 1px solid #B8DDF0;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      display: none;
    }

    #zoom-reset:hover { background: #ffffff; color: #0068B4; border-color: #00A6D9; }

    .pdf-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--blue-paler);
      color: var(--text-mid);
      gap: 14px;
    }

    .pdf-placeholder svg {
      opacity: 0.3;
    }

    .pdf-placeholder p {
      font-size: 15px;
      opacity: 0.65;
    }

    
    /* ── MAP DESCRIPTION BAR ── */
    .map-description {
      flex-shrink: 0;
      padding: 9px 16px;
      background: #E0F4FA;
      border-bottom: 1px solid #B8DDF0;
      font-size: 12px;
      color: #2C5F7A;
      line-height: 1.55;
    }

    .map-description p {
      margin-bottom: 4px;
    }

    .map-description p:last-child {
      margin-bottom: 0;
    }

    .map-description ul {
      padding-left: 14px;
      margin: 3px 0 0;
    }

    .map-description li {
      margin-bottom: 2px;
    }

    .map-description strong {
      color: #1A3A4A;
    }
/* ── RIGHT PANEL ── */
    .right-panel {
      width: 260px;
      flex-shrink: 0;
      background: var(--white);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px 14px;
    }

    .right-panel::-webkit-scrollbar { width: 5px; }
    .right-panel::-webkit-scrollbar-track { background: transparent; }
    .right-panel::-webkit-scrollbar-thumb { background: var(--blue-light); border-radius: 3px; }

    .info-heading {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--blue-dark);
      border-bottom: 2px solid var(--blue-pale);
      padding-bottom: 7px;
      margin-bottom: 14px;
    }

    .info-placeholder {
      color: var(--text-mid);
      font-size: 13px;
      opacity: 0.65;
      font-style: italic;
      line-height: 1.5;
    }

    .info-species-name {
      font-style: italic;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 12px;
      line-height: 1.35;
    }

    .flag-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px 3px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .flag-badge .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .flag-badge.green  { background: #E4F7EC; color: var(--flag-green); }
    .flag-badge.green .badge-dot  { background: var(--flag-green); }
    .flag-badge.yellow { background: #FFF3DC; color: var(--flag-yellow); }
    .flag-badge.yellow .badge-dot { background: var(--flag-yellow); }

    .info-row {
      margin-bottom: 12px;
    }

    .info-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--blue-mid);
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 13.5px;
      color: var(--text-dark);
    }

    .tss-bar-wrap {
      height: 5px;
      background: var(--blue-pale);
      border-radius: 3px;
      margin-top: 5px;
      overflow: hidden;
    }

    .tss-bar {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--blue-mid), var(--green-teal));
      transition: width 0.35s ease;
    }

    .info-comment {
      margin-top: 14px;
      padding: 9px 10px;
      background: #FFF8EC;
      border-left: 3px solid var(--flag-yellow);
      border-radius: 0 4px 4px 0;
      font-size: 12.5px;
      font-style: italic;
      color: #5A400E;
      line-height: 1.55;
    }
  </style>
</head>

<header>

    <h1>WP3 - Species distribution models</h1>

        </svg>
        <p>Select a species to view its distribution map</p>
      </div>
      <div id="img-viewport">
        <img id="map-img" alt="">
        <button id="zoom-reset" title="Reset zoom">Reset zoom</button>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="info-heading">Species Info</div>
    <div id="species-info">
      <p class="info-placeholder">Select a species from the list to view model details.</p>
    </div>
  </div>

</div>

  const MAP_DESCRIPTIONS = {
    binary_strict_png: "- Likely unsuitable - areas with probabilities predicted below the presence threshold.\n- Possibly suitable - areas with probabilities above the presence threshold, but with confidence values below 50 and probabilities below the mid-point of the minimum and maximum predicted presence probabilities.\n- Likely suitable - areas with probabilities above the presence threshold, but with either confidence values below 50 OR probabilities below the mid-point of the minimum and maximum predicted presence probabilities.\n- Very likely suitable - areas with probabilities above the presence threshold and with both confidence values above 50 and probabilities above the mid-point of the minimum and maximum predicted presence probabilities.",
    binary_png: "- Unsuitable - areas with probabilities below the presence threshold.\n- Suitable - areas with probabilities above the presence threshold.",
    binary_confidence_png: "- Unsuitable (high confidence) - areas with probabilities below the presence threshold and with confidence scores above 50.\n- Unsuitable (low confidence) - areas with probabilities below the presence threshold but with confidence scores below 50.\n- Suitable (low confidence) - areas with probabilities above the presence threshold but with confidence scores below 50.\n- Suitable (high confidence) - areas with probabilities above the presence threshold and with confidence scores above 50.",
    delta_png: "The scale represents relative probabilities above the presence threshold. Areas with a value of zero represent areas below the presence threshold. Areas with a value of 1 represent the lowest probability above the presence threshold. Areas with a value of 100 represent the highest probability above the presence threshold.",
    probability_png: "The scale represents predicted probability outputs from the ensemble species distribution model.",
    confidence_png: "The scale represents model confidence measured as agreement between members of the ensemble species distribution model (committee averaging). A value of 100 indicates that all members predicted the same outcome (presence or absence). A value of 0 indicates maximum disagreement between the members (half of the members predicting presence and half predicting absence)."
  };
  const allSpecies = { fish: [], invertebrates: [], macrophytes: [] };
  let currentGroup = 'fish';
  let currentSpecies = null;
  let currentMapType = 'binary_strict_png';

  // ── CSV parser (handles RFC 4180 quoted fields) ──────────────────────────────
  function parseCSV(text) {
    const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
    let headers = null;
    const rows = [];
    for (const raw of lines) {
      const line = raw.trim();
      if (!line) continue;
      const fields = [];
      let i = 0;
      while (i <= line.length) {
        if (i === line.length) { fields.push(''); break; }
        if (line[i] === '"') {
          let j = i + 1, val = '';
          while (j < line.length) {
            if (line[j] === '"') {
              if (line[j + 1] === '"') { val += '"'; j += 2; }
              else { j++; break; }
            } else { val += line[j++]; }
          }
          fields.push(val);
          i = j;
          if (line[i] === ',') i++;
        } else {
          const end = line.indexOf(',', i);
          if (end === -1) { fields.push(line.slice(i)); break; }
          else { fields.push(line.slice(i, end)); i = end + 1; }
        }
      }
      if (!headers) { headers = fields; continue; }
      if (fields.length < 2) continue;
      const obj = {};
      headers.forEach((h, idx) => { obj[h] = fields[idx] !== undefined ? fields[idx] : ''; });
      rows.push(obj);
    }
    return rows;
  }

  function init() {
    for (const r of SPECIES_DATA) {
      const g = r.output_repo;
      if (allSpecies[g]) allSpecies[g].push(r);
    }
    for (const g of Object.keys(allSpecies)) {
      allSpecies[g].sort((a, b) => a.full_name.localeCompare(b.full_name));
    }
    renderList();
    updateDescription();
  }

  // ── Render species list ──────────────────────────────────────────────────────
  function renderList() {
    const filter = document.getElementById('species-search').value.toLowerCase();
    const ul = document.getElementById('species-list');
    const countEl = document.getElementById('species-count');
    const source = allSpecies[currentGroup] || [];
    const filtered = filter ? source.filter(s => s.full_name.toLowerCase().includes(filter)) : source;

    countEl.textContent = filtered.length + ' species';
    ul.innerHTML = '';
    for (const sp of filtered) {
      const li = document.createElement('li');
      li.className = 'species-item' + (currentSpecies === sp ? ' active' : '');
      const dot = document.createElement('span');
      dot.className = 'flag-dot ' + sp.flag;
      const name = document.createElement('span');
      name.className = 'species-name';
      name.textContent = sp.full_name;
      li.append(dot, name);
      li.addEventListener('click', () => selectSpecies(sp));
      ul.appendChild(li);
    }
  }

  // ── Select a species ─────────────────────────────────────────────────────────
  function selectSpecies(sp) {
    currentSpecies = sp;
    renderList();
    loadPDF();
    renderInfo();
  }

  // ── Load image ───────────────────────────────────────────────────────────────
  function loadPDF() {
    if (!currentSpecies) return;
    const src = 'models_post/outputs/' + currentSpecies.output_repo
      + '/_pngs/' + currentMapType
      + '/' + currentSpecies.scientific_name + '.png';
    const img = document.getElementById('map-img');
    img.src = src;
    img.style.display = 'block';
    document.getElementById('pdf-placeholder').style.display = 'none';
    resetZoom();
  }

  // ── Render right panel ───────────────────────────────────────────────────────
  function renderInfo() {
    const sp = currentSpecies;
    const el = document.getElementById('species-info');
    if (!sp) {
      el.innerHTML = '<p class="info-placeholder">Select a species from the list to view model details.</p>';
      return;
    }

    const tss = parseFloat(sp.mean_TSS_ensemble);
    const tssText = isNaN(tss) ? 'N/A' : tss.toFixed(3);
    const tssWidth = isNaN(tss) ? 0 : Math.min(100, Math.round(tss * 100));
    const flagLabel = sp.flag === 'green' ? 'Good' : 'Caution';

    const fragment = document.createDocumentFragment();

    const nameEl = document.createElement('div');
    nameEl.className = 'info-species-name';
    nameEl.textContent = sp.full_name;
    fragment.appendChild(nameEl);

    const badge = document.createElement('span');
    badge.className = 'flag-badge ' + sp.flag;
    badge.innerHTML = '<span class="badge-dot"></span>' + escHtml(flagLabel);
    fragment.appendChild(badge);

    fragment.appendChild(infoRow('Ensemble TSS', tssText,
      '<div class="tss-bar-wrap"><div class="tss-bar" style="width:' + tssWidth + '%"></div></div>'));

    fragment.appendChild(infoRow('Models', sp.models || '—'));
    fragment.appendChild(infoRow('Presences', fmtNum(sp.num_presence)));
    fragment.appendChild(infoRow('Absences', fmtNum(sp.num_absence)));

    if (sp.comment && sp.comment.trim()) {
      const note = document.createElement('div');
      note.className = 'info-comment';
      note.textContent = sp.comment.trim();
      fragment.appendChild(note);
    }

    el.innerHTML = '';
    el.appendChild(fragment);
  }

  function infoRow(label, text, extraHTML) {
    const d = document.createElement('div');
    d.className = 'info-row';
    d.innerHTML = '<div class="info-label">' + escHtml(label) + '</div>'
      + '<div class="info-value">' + escHtml(String(text)) + '</div>'
      + (extraHTML || '');
    return d;
  }


  function descToHTML(text) {
    const lines = text.split('\n');
    let html = '', inList = false;
    for (const line of lines) {
      if (line.startsWith('- ')) {
        if (!inList) { html += '<ul>'; inList = true; }
        const content = line.slice(2);
        const sep = content.indexOf(' - ');
        html += sep !== -1
          ? '<li><strong>' + escHtml(content.slice(0, sep)) + '</strong> — ' + escHtml(content.slice(sep + 3)) + '</li>'
          : '<li>' + escHtml(content) + '</li>';
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        if (line.trim()) html += '<p>' + escHtml(line) + '</p>';
      }
    }
    if (inList) html += '</ul>';
    return html;
  }

  function updateDescription() {
    document.getElementById('map-description').innerHTML =
      descToHTML(MAP_DESCRIPTIONS[currentMapType] || '');
  }
  // ── Utilities ─────────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtNum(s) {
    const n = parseInt(s, 10);
    return isNaN(n) ? (s || '—') : n.toLocaleString();
  }


  // ── Zoom & pan ────────────────────────────────────────────────────────────────
  let zoomScale = 1, panX = 0, panY = 0;
  let isDragging = false, dragStartX, dragStartY, panStartX, panStartY;

  function applyTransform() {
    const img = document.getElementById('map-img');
    img.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoomScale + ')';
    document.getElementById('zoom-reset').style.display = zoomScale > 1.01 ? 'block' : 'none';
  }

  function resetZoom() {
    zoomScale = 1; panX = 0; panY = 0;
    applyTransform();
  }

  function initZoomPan() {
    const vp = document.getElementById('img-viewport');

    vp.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      const newScale = Math.min(8, Math.max(1, zoomScale * factor));
      const rect = vp.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      panX = mx - (mx - panX) * (newScale / zoomScale);
      panY = my - (my - panY) * (newScale / zoomScale);
      zoomScale = newScale;
      applyTransform();
    }, { passive: false });

    vp.addEventListener('mousedown', e => {
      isDragging = true;
      dragStartX = e.clientX; dragStartY = e.clientY;
      panStartX = panX; panStartY = panY;
      vp.classList.add('grabbing');
    });

    document.addEventListener('mousemove', e => {
      if (!isDragging) return;
      panX = panStartX + e.clientX - dragStartX;
      panY = panStartY + e.clientY - dragStartY;
      applyTransform();
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
      document.getElementById('img-viewport').classList.remove('grabbing');
    });

    document.getElementById('zoom-reset').addEventListener('click', resetZoom);
  }
  // ── Wire up tabs and search ───────────────────────────────────────────────────
  document.querySelectorAll('.group-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentGroup = btn.dataset.group;
      document.querySelectorAll('.group-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('species-search').value = '';
      renderList();
    });
  });

  document.querySelectorAll('.map-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentMapType = btn.dataset.map;
      document.querySelectorAll('.map-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (currentSpecies) loadPDF();
      updateDescription();
    });
  });

  document.getElementById('species-search').addEventListener('input', renderList);

  init();
  initZoomPan();
</script>
